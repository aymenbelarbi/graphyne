[package]
name = "graphyne-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "graphyne-cli"
path = "src/main.rs"

[dependencies]
graphyne-client = { path = "../graphyne-client" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
