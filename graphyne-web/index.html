<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphyne - Agent Search & Memory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            min-height: 600px;
        }
        
        .sidebar {
            width: 250px;
            background: #f5f5f5;
            padding: 20px;
            border-right: 1px solid #e0e0e0;
        }
        
        .sidebar h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .nav-item {
            padding: 10px 15px;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .nav-item:hover {
            background: #667eea;
            color: white;
        }
        
        .nav-item.active {
            background: #667eea;
            color: white;
        }
        
        .content {
            flex: 1;
            padding: 30px;
        }
        
        .search-section {
            margin-bottom: 30px;
        }
        
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-options {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .search-options select {
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: white;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .results {
            margin-top: 30px;
        }
        
        .result-item {
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .result-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .result-id {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }
        
        .result-score {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9em;
        }
        
        .result-data {
            color: #666;
            line-height: 1.6;
        }
        
        .memory-section {
            display: none;
        }
        
        .memory-section.active {
            display: block;
        }
        
        .memory-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .memory-list {
            margin-top: 20px;
        }
        
        .memory-item {
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
        }
        
        .memory-meta {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Graphyne</h1>
            <p>Agent Search & Memory Engine</p>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <h3>Navigation</h3>
                <div class="nav-item active" onclick="showSection('search')">🔍 Search</div>
                <div class="nav-item" onclick="showSection('memory')">🧠 Memory</div>
                <div class="nav-item" onclick="showSection('stats')">📊 Statistics</div>
            </div>
            
            <div class="content">
                <!-- Search Section -->
                <div id="search-section" class="search-section">
                    <h2>Search</h2>
                    <input type="text" id="searchInput" class="search-box" placeholder="Enter your search query..." onkeypress="if(event.key==='Enter') search()">
                    
                    <div class="search-options">
                        <select id="searchMode">
                            <option value="hybrid">Hybrid</option>
                            <option value="lexical">Lexical</option>
                            <option value="vector">Vector</option>
                            <option value="graph">Graph</option>
                        </select>
                        
                        <select id="searchLimit">
                            <option value="10">10 results</option>
                            <option value="20">20 results</option>
                            <option value="50">50 results</option>
                        </select>
                    </div>
                    
                    <button onclick="search()">Search</button>
                    
                    <div id="searchResults" class="results"></div>
                </div>
                
                <!-- Memory Section -->
                <div id="memory-section" class="memory-section">
                    <h2>Memory Store</h2>
                    
                    <div class="memory-form">
                        <h3>Store New Memory</h3>
                        <div class="form-group">
                            <label>Memory Type</label>
                            <select id="memoryType">
                                <option value="working">Working Memory</option>
                                <option value="episodic">Episodic Memory</option>
                                <option value="semantic">Semantic Memory</option>
                                <option value="procedural">Procedural Memory</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Content</label>
                            <textarea id="memoryContent" placeholder="Enter memory content..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Importance (0.0 - 1.0)</label>
                            <input type="number" id="memoryImportance" min="0" max="1" step="0.1" value="0.5">
                        </div>
                        
                        <button onclick="storeMemory()">Store Memory</button>
                    </div>
                    
                    <div id="memoryList" class="memory-list"></div>
                </div>
                
                <!-- Stats Section -->
                <div id="stats-section" class="memory-section">
                    <h2>System Statistics</h2>
                    <button onclick="loadStats()">Refresh Stats</button>
                    
                    <div id="statsContent" class="stats"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Navigation
        function showSection(section) {
            // Update nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show/hide sections
            document.querySelectorAll('.search-section, .memory-section').forEach(div => {
                div.classList.remove('active');
            });
            document.getElementById(section + '-section').classList.add('active');
            
            // Load data if needed
            if (section === 'stats') {
                loadStats();
            } else if (section === 'memory') {
                loadMemories();
            }
        }
        
        // Search functionality
        async function search() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) {
                alert('Please enter a search query');
                return;
            }
            
            const mode = document.getElementById('searchMode').value;
            const limit = document.getElementById('searchLimit').value;
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';
            
            try {
                const response = await fetch(`/v1/search?q=${encodeURIComponent(query)}&mode=${mode}&limit=${limit}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    resultsDiv.innerHTML = data.results.map(r => `
                        <div class="result-item">
                            <div class="result-header">
                                <span class="result-id">${r.id || 'N/A'}</span>
                                <span class="result-score">Score: ${(r.score || 0).toFixed(3)}</span>
                            </div>
                            <div class="result-data">${r.data || r.content || 'No content available'}</div>
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<div class="loading">No results found</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                console.error('Search error:', error);
            }
        }
        
        // Memory functionality
        async function storeMemory() {
            const type = document.getElementById('memoryType').value;
            const content = document.getElementById('memoryContent').value;
            const importance = parseFloat(document.getElementById('memoryImportance').value);
            
            if (!content.trim()) {
                alert('Please enter memory content');
                return;
            }
            
            try {
                const response = await fetch('/v1/memories', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        memory_type: type,
                        content: content,
                        importance: importance,
                        metadata: {}
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                alert('Memory stored successfully!');
                document.getElementById('memoryContent').value = '';
                loadMemories();
            } catch (error) {
                alert(`Error storing memory: ${error.message}`);
                console.error('Store memory error:', error);
            }
        }
        
        async function loadMemories() {
            const memoryList = document.getElementById('memoryList');
            memoryList.innerHTML = '<div class="loading">Loading memories...</div>';
            
            try {
                const response = await fetch('/v1/memories?limit=20');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.memories && data.memories.length > 0) {
                    memoryList.innerHTML = data.memories.map(m => `
                        <div class="memory-item">
                            <strong>${m.memory_type || 'Unknown'}</strong>
                            <p>${m.content || 'No content'}</p>
                            <div class="memory-meta">
                                Importance: ${m.importance || 0} | 
                                Created: ${m.created_at ? new Date(m.created_at).toLocaleString() : 'Unknown'}
                            </div>
                        </div>
                    `).join('');
                } else {
                    memoryList.innerHTML = '<div class="loading">No memories stored yet</div>';
                }
            } catch (error) {
                memoryList.innerHTML = `<div class="error">Error loading memories: ${error.message}</div>`;
                console.error('Load memories error:', error);
            }
        }
        
        // Stats functionality
        async function loadStats() {
            const statsContent = document.getElementById('statsContent');
            statsContent.innerHTML = '<div class="loading">Loading statistics...</div>';
            
            try {
                const response = await fetch('/admin/stats');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                statsContent.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${data.total_searches || 0}</div>
                        <div class="stat-label">Total Searches</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.total_memories || 0}</div>
                        <div class="stat-label">Total Memories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${(data.storage_size_bytes || 0).toLocaleString()}</div>
                        <div class="stat-label">Storage Size (bytes)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${(data.uptime_seconds || 0).toLocaleString()}s</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                `;
            } catch (error) {
                statsContent.innerHTML = `<div class="error">Error loading stats: ${error.message}</div>`;
                console.error('Load stats error:', error);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check health on load
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    console.log('System health:', data);
                })
                .catch(error => {
                    console.error('Health check failed:', error);
                });
        });
    </script>
</body>
</html>
