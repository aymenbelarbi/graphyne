syntax = "proto3";

package graphyne;

service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
}

service DocumentService {
  rpc PushDocument(PushDocumentRequest) returns (PushDocumentResponse);
  rpc PopDocument(PopDocumentRequest) returns (PopDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
}

service VectorService {
  rpc AddEmbedding(AddEmbeddingRequest) returns (AddEmbeddingResponse);
  rpc SearchVector(SearchVectorRequest) returns (SearchVectorResponse);
}

service GraphService {
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
  rpc AddEdge(AddEdgeRequest) returns (AddEdgeResponse);
  rpc TraverseGraph(TraverseGraphRequest) returns (TraverseGraphResponse);
}

service MemoryService {
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc RecallMemory(RecallMemoryRequest) returns (RecallMemoryResponse);
  rpc GetMemorySpaces(GetMemorySpacesRequest) returns (GetMemorySpacesResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
}

// GraphRAG Service for enhanced agent reasoning
service GraphRAGService {
  rpc Query(GraphRAGQueryRequest) returns (GraphRAGQueryResponse);
  rpc GetSubgraph(SubgraphRequest) returns (SubgraphResponse);
  rpc ExpandNode(ExpandNodeRequest) returns (ExpandNodeResponse);
}

message SearchRequest {
  string collection = 1;
  string bucket = 2;
  string query = 3;
  int32 limit = 4;
  string mode = 5;  // "lexical", "vector", "graph", "hybrid"
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message SearchResult {
  string id = 1;
  float score = 2;
  string data = 3;
}

message SuggestRequest {
  string collection = 1;
  string bucket = 2;
  string query = 3;
  int32 limit = 4;
}

message SuggestResponse {
  repeated string suggestions = 1;
}

message PushDocumentRequest {
  string collection = 1;
  string bucket = 2;
  string id = 3;
  string content = 4;
  map<string, string> metadata = 5;
}

message PushDocumentResponse {
  bool success = 1;
  string message = 2;
}

message PopDocumentRequest {
  string collection = 1;
  string bucket = 2;
  string id = 3;
}

message PopDocumentResponse {
  bool success = 1;
  string message = 2;
}

message GetDocumentRequest {
  string collection = 1;
  string bucket = 2;
  string id = 3;
}

message GetDocumentResponse {
  string id = 1;
  string content = 2;
  map<string, string> metadata = 3;
}

message AddEmbeddingRequest {
  string id = 1;
  repeated float values = 2;
  map<string, string> metadata = 3;
}

message AddEmbeddingResponse {
  bool success = 1;
  string message = 2;
}

message SearchVectorRequest {
  repeated float query = 1;
  int32 limit = 2;
  string collection = 3;
}

message SearchVectorResponse {
  repeated SearchResult results = 1;
}

message AddNodeRequest {
  string id = 1;
  string node_type = 2;
  string label = 3;
  map<string, string> properties = 4;
  repeated float embedding = 5;
}

message AddNodeResponse {
  bool success = 1;
  string message = 2;
}

message AddEdgeRequest {
  string from_id = 1;
  string to_id = 2;
  string edge_type = 3;
  map<string, string> properties = 4;
  float weight = 5;
}

message AddEdgeResponse {
  bool success = 1;
  string message = 2;
  string edge_id = 3;
}

message TraverseGraphRequest {
  string start_node_id = 1;
  string edge_type = 2;
  int32 max_depth = 3;
}

message TraverseGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

// Updated GraphNode with enhanced fields
message GraphNode {
  string id = 1;
  string node_type = 2;
  string label = 3;
  map<string, string> properties = 4;
  repeated float embedding = 5;
  string created_at = 6;
}

// Updated GraphEdge with enhanced fields
message GraphEdge {
  string id = 1;
  string from_id = 2;
  string to_id = 3;
  string edge_type = 4;
  map<string, string> properties = 5;
  float weight = 6;
}

// GraphPath message for traversal results
message GraphPath {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  float total_weight = 3;
}

// Memory Service Messages

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  WORKING = 1;
  EPISODIC = 2;
  SEMANTIC = 3;
  PROCEDURAL = 4;
}

message MemoryEntry {
  string id = 1;
  MemoryType memory_type = 2;
  string content = 3;
  repeated float embedding = 4;
  map<string, string> metadata = 5;
  string created_at = 6;
  string last_accessed = 7;
  uint32 access_count = 8;
  float importance = 9;
}

message StoreMemoryRequest {
  MemoryType memory_type = 1;
  string content = 2;
  repeated float embedding = 3;
  float importance = 4;
  map<string, string> metadata = 5;
  string space = 6;
}

message StoreMemoryResponse {
  bool success = 1;
  string message = 2;
  string memory_id = 3;
}

message RecallMemoryRequest {
  string query_text = 1;
  repeated float embedding = 2;
  repeated MemoryType memory_types = 3;
  string start_time = 4;
  string end_time = 5;
  float min_importance = 6;
  int32 limit = 7;
  string space = 8;
}

message RecallMemoryResponse {
  bool success = 1;
  string message = 2;
  repeated MemoryEntry memories = 3;
  repeated float scores = 4;
}

message GetMemorySpacesRequest {
  // Empty request
}

message MemorySpace {
  string name = 1;
  repeated MemoryType memory_types = 2;
  string retention_policy = 3;  // JSON string
  int32 max_entries = 4;
  string scoring_config = 4;  // JSON string
}

message GetMemorySpacesResponse {
  bool success = 1;
  string message = 2;
  repeated MemorySpace spaces = 3;
}

message UpdateMemoryRequest {
  string memory_id = 1;
  string content = 2;
  float importance = 3;
  map<string, string> metadata = 4;
  repeated float embedding = 5;
}

message UpdateMemoryResponse {
  bool success = 1;
  string message = 2;
}

message DeleteMemoryRequest {
  string memory_id = 1;
}

message DeleteMemoryResponse {
  bool success = 1;
  string message = 2;
}

// GraphRAG Messages

message GraphRAGQueryRequest {
  string query = 1;
  int32 max_hops = 2;
  int32 limit = 3;
}

message GraphRAGQueryResponse {
  string context = 1;
  repeated GraphNode nodes = 2;
  repeated GraphEdge edges = 3;
  float confidence = 4;
  string explanation = 5;
}

message SubgraphRequest {
  repeated string node_ids = 1;
  int32 max_hops = 2;
}

message SubgraphResponse {
  bool success = 1;
  string message = 2;
  repeated GraphNode nodes = 3;
  repeated GraphEdge edges = 4;
}

message ExpandNodeRequest {
  string node_id = 1;
  int32 depth = 2;
}

message ExpandNodeResponse {
  bool success = 1;
  string message = 2;
  repeated GraphNode nodes = 3;
  repeated GraphEdge edges = 4;
}
